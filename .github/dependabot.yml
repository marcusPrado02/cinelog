# ═══════════════════════════════════════════════════════════════
# A03:2025 — Dependabot: atualizações automáticas de dependências
#
# Monitora dependências e cria PRs automaticamente quando:
# 1. Uma nova versão é publicada
# 2. Uma CVE é descoberta em uma dependência usada
#
# Agrupamento: dependências do mesmo ecossistema em um único PR.
# ═══════════════════════════════════════════════════════════════

version: 2

updates:
    # ── Dependências Maven (Java) ──
    - package-ecosystem: "maven"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:00"
          timezone: "America/Sao_Paulo"
      open-pull-requests-limit: 10
      reviewers:
          - "marcusPrado02"
      labels:
          - "dependencies"
          - "security"
      commit-message:
          prefix: "deps"
          include: "scope"
      groups:
          spring-boot:
              patterns:
                  - "org.springframework.boot*"
                  - "org.springframework.cloud*"
                  - "org.springframework.security*"
          testing:
              patterns:
                  - "org.junit*"
                  - "org.mockito*"
                  - "org.assertj*"
          observability:
              patterns:
                  - "io.micrometer*"
                  - "io.opentelemetry*"

    # ── GitHub Actions (workflows) ──
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      labels:
          - "ci/cd"
          - "dependencies"
      commit-message:
          prefix: "ci"
