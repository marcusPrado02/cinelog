# ═══════════════════════════════════════════════════════════════
# A03:2025 — Dependency Review em Pull Requests
#
# Analisa APENAS as dependências NOVAS ou ALTERADAS no PR.
# Se o PR adiciona uma dependência com CVE conhecida (HIGH+),
# o check FALHA e bloqueia o merge.
# Também bloqueia licenças restritivas (GPL, AGPL).
# ═══════════════════════════════════════════════════════════════

name: "\U0001F50E Dependency Review"

on:
    pull_request:
        branches: [master]

permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-review:
        name: "\U0001F50E Revisar dependências novas"
        runs-on: ubuntu-latest

        steps:
            - name: "\U0001F4E5 Checkout código"
              uses: actions/checkout@v6

            - name: "\U0001F50E Dependency Review"
              uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: high
                  deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
                  comment-summary-in-pr: always
