# ═══════════════════════════════════════════════════════════════════
# A03:2025 — Pipeline de segurança da supply chain
#
# O que faz:
# 1. OWASP Dependency-Check: escaneia CVEs em todas as dependências
# 2. CycloneDX SBOM: gera inventário completo de componentes
# 3. Maven Enforcer: valida regras de build (versões, duplicatas)
# 4. Upload de artefatos: relatórios disponíveis como artifacts do workflow
#
# Quando executa:
# - Em todo push para master (proteção contínua)
# - Em todo pull request para master (gate de segurança)
# - Todo domingo à meia-noite (scan semanal para novas CVEs)
# ═══════════════════════════════════════════════════════════════════

name: "\U0001F512 Security Supply Chain Scan"

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Todo domingo à 00:00 UTC — detecta novas CVEs publicadas durante a semana
        - cron: "0 0 * * 0"

permissions:
    contents: read
    security-events: write

jobs:
    # ─────────────────────────────────────────────
    # Job 1: OWASP Dependency-Check (CVE scanning)
    # ─────────────────────────────────────────────
    dependency-check:
        name: "\U0001F6E1\uFE0F OWASP Dependency-Check"
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: "\U0001F4E5 Checkout código"
              uses: actions/checkout@v4

            - name: "☕ Setup Java 21"
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            # Cache do banco NVD (National Vulnerability Database)
            # O download completo leva ~10min; com cache, ~30s
            - name: "\U0001F4BE Cache NVD database"
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository/org/owasp/dependency-check-data
                  key: nvd-${{ runner.os }}-${{ github.run_id }}
                  restore-keys: |
                      nvd-${{ runner.os }}-

            - name: "\U0001F50D Executar OWASP Dependency-Check"
              run: |
                  ./mvnw dependency-check:check \
                    -DfailBuildOnCVSS=7 \
                    -Dformats=HTML,JSON,SARIF \
                    -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
                    -DsuppressionFile=src/main/resources/dependency-check-suppressions.xml
              continue-on-error: true

            - name: "\U0001F4CA Upload relatório Dependency-Check"
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: dependency-check-report
                  path: target/dependency-check/
                  retention-days: 30

            - name: "\U0001F4E4 Upload SARIF para GitHub Security"
              if: always() && hashFiles('target/dependency-check/dependency-check-report.sarif') != ''
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: target/dependency-check/dependency-check-report.sarif
                  category: dependency-check

    # ─────────────────────────────────────────────
    # Job 2: SBOM Generation (Software Bill of Materials)
    # ─────────────────────────────────────────────
    sbom:
        name: "\U0001F4CB Gerar SBOM (CycloneDX)"
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: "\U0001F4E5 Checkout código"
              uses: actions/checkout@v4

            - name: "☕ Setup Java 21"
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            - name: "\U0001F4E6 Gerar SBOM"
              run: ./mvnw cyclonedx:makeBom -DskipTests

            - name: "\U0001F4CA Upload SBOM"
              uses: actions/upload-artifact@v7
              with:
                  name: sbom-cinelog
                  path: |
                      target/cinelog-sbom.json
                      target/cinelog-sbom.xml
                  retention-days: 90

    # ─────────────────────────────────────────────
    # Job 3: Maven Enforcer (regras de build)
    # ─────────────────────────────────────────────
    enforcer:
        name: "⚖\uFE0F Maven Enforcer Rules"
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: "\U0001F4E5 Checkout código"
              uses: actions/checkout@v4

            - name: "☕ Setup Java 21"
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            - name: "⚖\uFE0F Validar regras de build"
              run: ./mvnw enforcer:enforce -DskipTests

    # ─────────────────────────────────────────────
    # Job 4: Verificação de licenças
    # ─────────────────────────────────────────────
    license-check:
        name: "\U0001F4DC Verificação de licenças"
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: "\U0001F4E5 Checkout código"
              uses: actions/checkout@v4

            - name: "☕ Setup Java 21"
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            - name: "\U0001F4DC Listar licenças das dependências"
              run: ./mvnw license:aggregate-third-party-report -DskipTests || true

            - name: "\U0001F4CA Upload relatório de licenças"
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: license-report
                  path: target/site/aggregate-third-party-report.html
                  retention-days: 30
