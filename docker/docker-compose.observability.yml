version: 3.8

services:
    # ===== Aplicação =====
    cinelog:
        build:
            context: ..
            dockerfile: Dockerfile
        container_name: cinelog-app
        ports:
            - 8080:8080
        environment:
            SPRING_PROFILES_ACTIVE: docker
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cinelog
            SPRING_DATASOURCE_USERNAME: cinelog
            SPRING_DATASOURCE_PASSWORD: cinelog123
            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
            OTEL_SERVICE_NAME: cinelog
            OTEL_TRACES_EXPORTER: otlp
            OTEL_METRICS_EXPORTER: otlp
            OTEL_LOGS_EXPORTER: otlp
        depends_on:
            postgres:
                condition: service_healthy
            otel-collector:
                condition: service_started
        networks:
            - cinelog-network
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: 3

    # ===== Banco de Dados =====
    postgres:
        image: postgres:15-alpine
        container_name: cinelog-postgres
        ports:
            - 5432:5432
        environment:
            POSTGRES_DB: cinelog
            POSTGRES_USER: cinelog
            POSTGRES_PASSWORD: cinelog123
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [CMD-SHELL, pg_isready -U cinelog]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - cinelog-network

    # ===== Prometheus (Métricas) =====
    prometheus:
        image: prom/prometheus:latest
        container_name: cinelog-prometheus
        ports:
            - 9090:9090
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
            - --web.enable-lifecycle
        volumes:
            - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        networks:
            - cinelog-network
        restart: unless-stopped

    # ===== OpenTelemetry Collector =====
    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        container_name: cinelog-otel-collector
        command: [--config=/etc/otel-collector-config.yaml]
        ports:
            - 4317:4317 # OTLP gRPC
            - 4318:4318 # OTLP HTTP
            - 8888:8888 # Prometheus metrics do collector
            - 8889:8889 # Prometheus exporter
        volumes:
            - ../observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
        networks:
            - cinelog-network
        restart: unless-stopped

    # ===== Tempo (Traces) =====
    tempo:
        image: grafana/tempo:latest
        container_name: cinelog-tempo
        command: [-config.file=/etc/tempo.yaml]
        ports:
            - 3200:3200 # Tempo HTTP
            - 4319:4317 # OTLP gRPC (secondary)
        volumes:
            - ../observability/tempo.yaml:/etc/tempo.yaml:ro
            - tempo-data:/tmp/tempo
        networks:
            - cinelog-network
        restart: unless-stopped

    # ===== Loki (Logs) =====
    loki:
        image: grafana/loki:latest
        container_name: cinelog-loki
        ports:
            - 3100:3100
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - loki-data:/loki
        networks:
            - cinelog-network
        restart: unless-stopped

    # ===== Promtail (Log Shipper) =====
    promtail:
        image: grafana/promtail:latest
        container_name: cinelog-promtail
        volumes:
            - /var/log:/var/log:ro
            - ../observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
        command: -config.file=/etc/promtail/config.yaml
        networks:
            - cinelog-network
        restart: unless-stopped

    # ===== Grafana (Visualização) =====
    grafana:
        image: grafana/grafana:latest
        container_name: cinelog-grafana
        ports:
            - 3000:3000
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin123
            GF_USERS_ALLOW_SIGN_UP: false
            GF_INSTALL_PLUGINS: grafana-piechart-panel
            GF_AUTH_ANONYMOUS_ENABLED: true
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
        volumes:
            - grafana-data:/var/lib/grafana
            - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - prometheus
            - loki
            - tempo
        networks:
            - cinelog-network
        restart: unless-stopped

    # ===== Logstash (Opcional - para análise avançada) =====
    logstash:
        image: docker.elastic.co/logstash/logstash:8.11.0
        container_name: cinelog-logstash
        ports:
            - 5000:5000/tcp
            - 5000:5000/udp
            - 9600:9600
        volumes:
            - ../logstash/pipeline:/usr/share/logstash/pipeline:ro
        environment:
            LS_JAVA_OPTS: -Xmx256m -Xms256m
        networks:
            - cinelog-network
        restart: unless-stopped

networks:
    cinelog-network:
        driver: bridge

volumes:
    postgres-data:
    prometheus-data:
    tempo-data:
    loki-data:
    grafana-data:
