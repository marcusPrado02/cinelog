version: "3.8"

services:
    # MySQL Database
    mysql:
        image: mysql:8.0
        container_name: cinelog-mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: cinelog
            MYSQL_USER: cinelog
            MYSQL_PASSWORD: cinelog
        ports:
            - 3306:3306
        volumes:
            - mysql-data:/var/lib/mysql
            - ../docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        networks:
            - cinelog-network
        healthcheck:
            test: [CMD, mysqladmin, ping, -h, localhost, -u, cinelog, -pcinelog]
            interval: 10s
            timeout: 5s
            retries: 5

    # Redis Cache
    redis:
        image: redis:7-alpine
        container_name: cinelog-redis
        ports:
            - 6379:6379
        networks:
            - cinelog-network
        healthcheck:
            test: [CMD, redis-cli, ping]
            interval: 10s
            timeout: 3s
            retries: 5

    # Zookeeper (necessário para Kafka)
    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        container_name: cinelog-zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - 2181:2181
        networks:
            - cinelog-network
        healthcheck:
            test: [CMD, nc, -z, localhost, "2181"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Kafka Broker
    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: cinelog-kafka
        depends_on:
            zookeeper:
                condition: service_healthy
        ports:
            - 9092:9092
            - 29092:29092
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
            KAFKA_LOG_RETENTION_HOURS: 168
        networks:
            - cinelog-network
        healthcheck:
            test:
                [
                    CMD,
                    kafka-broker-api-versions,
                    --bootstrap-server,
                    localhost:9092,
                ]
            interval: 10s
            timeout: 10s
            retries: 5

    # Kafka UI (opcional - interface web para gerenciar Kafka)
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: cinelog-kafka-ui
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - 8090:8080
        environment:
            KAFKA_CLUSTERS_0_NAME: cinelog-cluster
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
            KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
        networks:
            - cinelog-network

networks:
    cinelog-network:
        driver: bridge

volumes:
    mysql-data:
