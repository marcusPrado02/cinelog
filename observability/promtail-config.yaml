server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cinelog
    static_configs:
      - targets:
          - localhost
        labels:
          job: cinelog
          __path__: /var/log/cinelog/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            thread: thread
            traceId: traceId
            spanId: spanId
            userId: userId
      - labels:
          level:
          logger:
          traceId:
          spanId:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message
