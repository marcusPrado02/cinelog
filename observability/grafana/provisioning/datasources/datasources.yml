apiVersion: 1

datasources:
    # Prometheus - Métricas
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true
      jsonData:
          timeInterval: 5s
          httpMethod: POST
      version: 1

    # Tempo - Traces
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      editable: true
      jsonData:
          httpMethod: GET
          tracesToLogs:
              datasourceUid: loki
              tags: [traceId, spanId]
          tracesToMetrics:
              datasourceUid: prometheus
          serviceMap:
              datasourceUid: prometheus
      version: 1

    # Loki - Logs
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: true
      jsonData:
          maxLines: 1000
          derivedFields:
              - datasourceUid: tempo
                matcherRegex: traceId=(\\w+)
                name: TraceID
                url: $${__value.raw}
      version: 1
