# ═══════════════════════════════════════════════════════════════════
# Perfil DEV — sobrescreve defaults de produção para auxiliar no
# desenvolvimento local.  A05 (OWASP): configs permissivas apenas aqui.
# ═══════════════════════════════════════════════════════════════════

server:
    error:
        include-message: always
        include-binding-errors: always
        include-stacktrace: on_param

# Swagger habilitado em dev (via @Profile no OpenApiConfig)
springdoc:
    swagger-ui:
        enabled: true
        # SSO via Keycloak: clientId público que o Swagger usa para Auth Code + PKCE
        oauth:
            client-id: cinelog-app
            use-pkce-with-authorization-code-grant: true
    api-docs:
        enabled: true

# Actuator mais permissivo em dev
management:
    endpoints:
        web:
            exposure:
                include: health,info,env,beans,mappings,metrics,prometheus
        enabled-by-default: true
    endpoint:
        health:
            show-details: always
        env:
            show-values: when-authorized

# CORS permissivo para dev local (React/Vue/Angular)
cinelog:
    security:
        cors:
            allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:4200

logging:
    level:
        root: INFO
        org.springframework.security: DEBUG
        com.cine.cinelog: DEBUG

# ─────────────────────────────────────────────────────────────────
# IAM – Semana 2: Keycloak OAuth2 Resource Server (dev local)
# Ativa validação de tokens RS256 do Keycloak. Quando esta prop estiver
# definida, Spring Boot cria o JwtDecoder via JWKS automaticamente.
# O JwtAuthenticationFilter detecta tokens Keycloak pelo claim `iss`
# e os delega ao BearerTokenAuthenticationFilter.
# ─────────────────────────────────────────────────────────────────
spring:
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/cinelog}
            client:
                registration:
                    keycloak:
                        client-id: cinelog-app
                        client-secret: ${KEYCLOAK_CLIENT_SECRET:cinelog-secret}
                        authorization-grant-type: authorization_code
                        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
                        scope: openid,profile,email,roles
                provider:
                    keycloak:
                        issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/cinelog}
                        user-name-attribute: preferred_username
