spring:
    application:
        name: cinelog-api
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cinelog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
        username: ${SPRING_DATASOURCE_USERNAME:cinelog}
        password: ${SPRING_DATASOURCE_PASSWORD:cinelog}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            pool-name: cinelog-pool
            minimum-idle: 2
            maximum-pool-size: 10
            auto-commit: false
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            transaction-isolation: TRANSACTION_READ_COMMITTED
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            database: 0
            timeout: 2000
    cache:
        type: redis

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false
        open-in-view: false

    liquibase:
        enabled: true
        change-log: classpath:liquibase/db.changelog-master.xml

    batch:
        jdbc:
            initialize-schema: never
        job:
            enabled: false # Desabilita auto-execução de jobs no startup; use a API ou o scheduler

    mvc:
        problemdetails:
            enabled: true

    # Kafka configuração (será usado no PR4)
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all
            retries: 3
            properties:
                "[linger.ms]": 10
                "[max.in.flight.requests.per.connection]": 5
                "[enable.idempotence]": true
        consumer:
            group-id: cinelog-consumer-group
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            auto-offset-reset: earliest
            enable-auto-commit: false
            properties:
                # A08:2025 — Restringir pacotes confiáveis para desserialização Kafka
                # (wildcard "*" permite desserialização arbitrária → RCE)
                "[spring.json.trusted.packages]": "com.cine.cinelog.core.domain.events,com.cine.cinelog.core.domain.events.watchentry,com.cine.cinelog.infrastructure.persistence.outbox,java.util,java.lang"
        listener:
            ack-mode: manual
    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        username: ${MAIL_USER:}
        password: ${MAIL_PASS:}
        properties:
            mail.smtp.auth: false
            mail.smtp.starttls.enable: false

springdoc:
    api-docs:
        path: /v3/api-docs # JSON da especificação
    swagger-ui:
        path: /swagger-ui # UI acessível em /swagger-ui (redireciona p/ index)
        display-request-duration: true
        tags-sorter: alpha
        operations-sorter: method
    default-flat-param-object: true # Usa parâmetros simples (não nested) para Pageable

server:
    # A05: não expor versão/tecnologia em headers HTTP
    server-header: ""
    error:
        # A02: não expor detalhes internos ao cliente em produção.
        # O perfil dev (application-dev.yml) pode sobrescrever para always.
        include-message: never
        include-binding-errors: never
        include-exception: false
        include-stacktrace: never
        whitelabel:
            enabled: false

logging:
    level:
        root: INFO
        "org.springframework": INFO
        "org.hibernate.SQL": WARN
    usecase:
        slow-threshold-ms: 800
        sample-rate: 1.0 # 1.0 = logar tudo; 0.1 = 10%

# A05: Actuator — superfície mínima por padrão (profiles podem ampliar)
management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,loggers,metrics,caches
        enabled-by-default: false
    endpoint:
        health:
            enabled: true
            show-details: never
        info:
            enabled: true
        prometheus:
            enabled: true
        loggers:
            enabled: true
        metrics:
            enabled: true
        caches:
            enabled: true
    # Micrometer tracing
    tracing:
        sampling:
            probability: 1.0
        enabled: true
    metrics:
        tags:
            application: cinelog
    otlp:
        tracing:
            endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces} # via OTel Collector
        metrics:
            export:
                enabled: false # métricas vão via Prometheus (scrape), não OTLP
info:
    app:
        name: cinelog
        version: v1

resilience4j:
    circuitbreaker:
        instances:
            tmdb:
                slidingWindowSize: 20
                failureRateThreshold: 50
                waitDurationInOpenState: 10s
                permittedNumberOfCallsInHalfOpenState: 3
                automaticTransitionFromOpenToHalfOpenEnabled: true
                # A10:2025 — registrar mudanças de estado no log
                registerHealthIndicator: true

    retry:
        instances:
            tmdb:
                maxAttempts: 3
                waitDuration: 500ms
                retryExceptions:
                    - org.springframework.web.reactive.function.client.WebClientRequestException
                    - java.io.IOException

    # A10:2025 — Timeout para chamadas à API TMDb
    timelimiter:
        instances:
            tmdb:
                timeoutDuration: 3s
                cancelRunningFuture: true

    # A10:2025 — Limitar chamadas concorrentes à API TMDb
    bulkhead:
        instances:
            tmdb:
                maxConcurrentCalls: 10
                maxWaitDuration: 500ms

cinelog:
    security:
        # A05: CORS — origens permitidas (profile-specific)
        cors:
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            max-age-seconds: 3600
        jwt:
            secret: ${CINELOG_SECURITY_JWT_SECRET:MINHA_CHAVE_MEGA_SECRETA_DE_NO_MINIMO_32_CHARS}
            expiration-seconds: ${CINELOG_SECURITY_JWT_EXPIRATION_SECONDS:3600}
        auth:
            # A07:2025 — Account lockout
            max-login-attempts: ${CINELOG_AUTH_MAX_LOGIN_ATTEMPTS:5}
            lock-duration-seconds: ${CINELOG_AUTH_LOCK_DURATION_SECONDS:900}
            # A07:2025 — Refresh token rotation
            refresh-token-expiration-seconds: ${CINELOG_AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
        enabled: true
        # A09:2025 — Security alerting thresholds
        alerting:
            window-seconds: ${CINELOG_SECURITY_ALERTING_WINDOW_SECONDS:300}
            threshold-auth-failure: ${CINELOG_SECURITY_ALERTING_THRESHOLD_AUTH_FAILURE:10}
            threshold-sqli: ${CINELOG_SECURITY_ALERTING_THRESHOLD_SQLI:3}
            threshold-rate-limit: ${CINELOG_SECURITY_ALERTING_THRESHOLD_RATE_LIMIT:50}
            threshold-tamper: ${CINELOG_SECURITY_ALERTING_THRESHOLD_TAMPER:1}
        keycloak:
            # Issuer URI do realm Keycloak. Usado pelo OpenApiConfig (Swagger SSO)
            # e pelo JwtAuthenticationFilter para detectar tokens Keycloak.
            # Sobrescrito em application-dev.yml e via env var KEYCLOAK_ISSUER_URI.
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/cinelog}
            # ClientId do Keycloak para extração de resource_access roles
            client-id: ${KEYCLOAK_CLIENT_ID:cinelog-app}
        # Preparação SAML (ADR-IAM-001) – não ativo por padrão
        saml:
            enabled: false
            # entity-id: https://cinelog.example.com/saml2/service-provider-metadata/azure-ad
            # idp-metadata-url: https://login.microsoftonline.com/{tenant}/federationmetadata/2007-06/federationmetadata.xml
    tmdb:
        base-url: https://api.themoviedb.org/3
        # Use o "API Read Access Token" (JWT longo) da página TMDb → Settings → API
        # OU a v3 API Key curta — ambas funcionam como Bearer token
        bearer-token: ${TMDB_API_KEY:coloque_sua_key_aqui}
        language: pt-BR
        region: BR
        timeout-ms: 3000
    metrics:
        domain:
            enabled: true
        slow:
            enabled: true

    audit:
        enabled: true

    integration:
        tracing:
            enabled: true

    batch:
        max-pages: 10
        sort-by: popularity.desc
        chunk-size: 20
        jobs:
            sync-genres:
                enabled: true
                cron: "0 0 3 * * SUN"
            import-movies:
                enabled: true
                cron: "0 30 3 * * SUN"
                max-pages: ${BATCH_IMPORT_MOVIES_MAX_PAGES:10}
            import-tv-shows:
                enabled: true
                cron: "0 0 4 * * SUN"
                max-pages: ${BATCH_IMPORT_TV_SHOWS_MAX_PAGES:10}
            import-credits:
                enabled: true
                cron: "0 30 4 * * SUN"
            import-seasons:
                enabled: true
                cron: "0 0 5 * * SUN"
    reports:
        enabled: true
        from-email: ${REPORT_FROM_EMAIL:noreply@cinelog.dev}
        from-name: CineLog
        base-url: ${APP_BASE_URL:http://localhost:8080}
        cron:
            weekly-digest: "0 0 8 * * MON"
            trending: "0 0 18 * * FRI"
            platform-report: "0 0 6 * * SUN"

# Kafka custom app properties (usados por @KafkaListener nos consumers)
kafka:
    consumer:
        group-id: cinelog-consumer-group
    topics:
        watch-entry-created: cinelog.watchentry.created.v1

# Outbox Pattern configuração
outbox:
    publisher:
        enabled: true
        fixed-rate-ms: 5000 # Processa outbox a cada 5 segundos
        initial-delay-ms: 10000 # Aguarda 10s após startup
        batch-size: 100 # Processa até 100 eventos por vez
        retention-days: 7 # Remove eventos SENT com mais de 7 dias
    housekeeping:
        cron: 0 0 1 * * ? # Diariamente às 01:00


# ═════════════════════════════════════════════════════════════════════
