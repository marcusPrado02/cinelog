<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        /* ══════════════════════════════════════════════════
           CineLog PDF — Shared Base Styles (v2)
           Gotenberg usa Chromium headless → CSS moderno funciona.
           Cada template inclui estes estilos inline.
           ══════════════════════════════════════════════════ */

@page { margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: #e0e0e0; background: #0d0d0d; font-size: 11px; line-height: 1.5;
}

/* ── Header ─────────────────────────────────────────── */
.report-header {
    background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
    color: #fff; padding: 28px 36px;
    display: flex; justify-content: space-between; align-items: center;
}
.report-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.report-header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 4px; }
.report-header .logo { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
.report-header .header-icon { font-size: 20px; margin-right: 8px; vertical-align: middle; }

/* ── Content ────────────────────────────────────────── */
.content { padding: 24px 36px 40px; }

/* ── Metric Cards ───────────────────────────────────── */
.metrics-row { display: flex; gap: 14px; margin-bottom: 28px; }
.metric-card {
    flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 10px; padding: 16px; text-align: center;
}
.metric-card .icon { font-size: 22px; margin-bottom: 4px; display: block; }
.metric-card .value { font-size: 28px; font-weight: 700; color: #e50914; }
.metric-card .label {
    font-size: 10px; color: #999; text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 4px;
}
.metric-card .growth { color: #4caf50; font-size: 10px; margin-top: 2px; }

/* ── Tables ─────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
thead th {
    background: #1a1a1a; color: #e50914; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 10px 12px; text-align: left; border-bottom: 2px solid #e50914;
}
tbody td { padding: 10px 12px; border-bottom: 1px solid #1e1e1e; vertical-align: middle; }
tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }

/* ── Badges ─────────────────────────────────────────── */
.badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 9px; font-weight: 600; text-transform: uppercase;
}
.badge-movie { background: #e50914; color: #fff; }
.badge-tv { background: #0077cc; color: #fff; }

/* ── Rating ─────────────────────────────────────────── */
.rating { color: #f5c518; font-weight: 700; }
.rating-pill {
    background: rgba(245,197,24,0.12); padding: 3px 10px; border-radius: 12px;
    color: #f5c518; font-weight: 700; font-size: 11px;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}

/* ── Section Title ──────────────────────────────────── */
.section-title {
    font-size: 15px; font-weight: 700; color: #fff;
    margin: 28px 0 12px; padding-bottom: 8px;
    border-bottom: 2px solid #e50914;
    display: flex; align-items: center; gap: 8px;
}
.section-title .sec-icon { font-size: 16px; }

/* ── Footer ─────────────────────────────────────────── */
.report-footer {
    text-align: center; font-size: 9px; color: #666;
    padding: 20px 36px; border-top: 1px solid #1e1e1e;
}

/* ── Rank ───────────────────────────────────────────── */
.rank {
    font-size: 16px; font-weight: 800; color: #e50914;
    text-align: center; min-width: 26px;
}

/* ── Media Cell (poster + title in table) ───────────── */
.media-cell { display: flex; align-items: center; gap: 10px; }
.poster-sm {
    width: 40px; height: 60px; border-radius: 4px;
    object-fit: cover; flex-shrink: 0; background: #111;
}
.no-poster {
    width: 40px; height: 60px; border-radius: 4px;
    background: linear-gradient(135deg, #252525, #1a1a1a);
    display: flex; align-items: center; justify-content: center;
    color: #444; font-size: 18px; flex-shrink: 0; border: 1px solid #2a2a2a;
}
.title-wrap .title { font-weight: 600; color: #fff; font-size: 11px; line-height: 1.3; }
.title-wrap .year-sm { font-size: 9px; color: #777; margin-top: 1px; }

/* ── Actor Cards ────────────────────────────────────── */
.actor-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
.actor-card {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 14px; width: calc(50% - 7px); display: flex; gap: 12px;
    page-break-inside: avoid;
}
.actor-photo {
    width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
    flex-shrink: 0; border: 2px solid #e50914;
}
.no-photo {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
    display: flex; align-items: center; justify-content: center;
    color: #444; font-size: 24px; flex-shrink: 0; border: 2px solid #333;
}
.actor-details { flex: 1; min-width: 0; }
.actor-name-text { font-size: 13px; font-weight: 700; color: #fff; }
.actor-meta { font-size: 10px; color: #999; margin-top: 2px; }
.actor-stat-row { display: flex; gap: 14px; margin-top: 6px; font-size: 10px; color: #ccc; }
.actor-stat-row .sv { color: #e50914; font-weight: 700; }
.filmography { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a2a2a; }
.filmography-label {
    font-size: 9px; color: #666; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 4px;
}
.film-entry {
    font-size: 10px; color: #ccc;
    display: flex; justify-content: space-between; padding: 2px 0;
}
.film-entry .fr { color: #f5c518; font-weight: 600; }

/* ── Genre ───────────────────────────────────────────── */
.genre-tags { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.genre-tag {
    background: linear-gradient(135deg, #e50914, #b20710); color: #fff;
    padding: 5px 16px; border-radius: 20px; font-size: 10px; font-weight: 600;
}
.genre-badge {
    font-size: 24px; font-weight: 700; color: #e50914;
    display: inline-block; background: #1a1a1a;
    padding: 8px 22px; border-radius: 10px; border: 2px solid #e50914;
}

/* ── Role badge ──────────────────────────────────────── */
.role-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 9px; font-weight: 600; background: #333; color: #ccc;
}

/* ── Misc ────────────────────────────────────────────── */
.highlight { color: #e50914; font-weight: 700; }
.page-break { page-break-before: always; }
.empty-msg { text-align: center; color: #666; padding: 24px; font-style: italic; }

    </style>
</head>

</body>
</html>
