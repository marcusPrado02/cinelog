<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <style>
            @page {
                margin: 0;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    "Segoe UI",
                    -apple-system,
                    BlinkMacSystemFont,
                    Roboto,
                    sans-serif;
                color: #e0e0e0;
                background: #0d0d0d;
                font-size: 11px;
                line-height: 1.5;
            }
            .report-header {
                background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
                color: #fff;
                padding: 28px 36px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .report-header h1 {
                font-size: 22px;
                font-weight: 700;
            }
            .report-header .subtitle {
                font-size: 12px;
                opacity: 0.85;
                margin-top: 4px;
            }
            .report-header .logo {
                font-size: 28px;
                font-weight: 800;
                letter-spacing: 2px;
            }
            .content {
                padding: 24px 36px 40px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 12px;
            }
            thead th {
                background: #1a1a1a;
                color: #e50914;
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                padding: 10px 12px;
                text-align: left;
                border-bottom: 2px solid #e50914;
            }
            tbody td {
                padding: 10px 12px;
                border-bottom: 1px solid #1e1e1e;
                vertical-align: middle;
            }
            tbody tr:nth-child(even) {
                background: #111;
            }
            .rating {
                color: #f5c518;
                font-weight: 700;
            }
            .section-title {
                font-size: 15px;
                font-weight: 700;
                color: #fff;
                margin: 24px 0 12px;
                padding-bottom: 6px;
                border-bottom: 2px solid #e50914;
            }
            .report-footer {
                text-align: center;
                font-size: 9px;
                color: #666;
                padding: 20px 36px;
                border-top: 1px solid #1e1e1e;
            }
            .rank {
                font-size: 14px;
                font-weight: 800;
                color: #e50914;
                text-align: center;
            }
            .role-badge {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 4px;
                font-size: 9px;
                font-weight: 600;
                background: #333;
                color: #ccc;
            }
        </style>
    </head>
    <body>
        <div class="report-header">
            <div>
                <h1 th:text="'Top ' + ${data.limit} + ' Atores'">
                    Top 10 Atores
                </h1>
                <div class="subtitle">
                    Atores com filmes mais bem avaliados — Gerado em
                    <span
                        th:text="${#temporals.format(data.generatedAt, 'dd/MM/yyyy HH:mm')}"
                        >01/01/2026</span
                    >
                </div>
            </div>
            <div class="logo">CINELOG</div>
        </div>

        <div class="content">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Função</th>
                        <th>Filmes</th>
                        <th>Nota Média</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="actor, idx : ${data.actors}">
                        <td class="rank" th:text="${idx.count}">1</td>
                        <td th:text="${actor.name}">Nome</td>
                        <td>
                            <span class="role-badge" th:text="${actor.topRole}"
                                >ACTOR</span
                            >
                        </td>
                        <td th:text="${actor.filmCount}">5</td>
                        <td
                            class="rating"
                            th:text="${actor.avgRating != null ? actor.avgRating : '—'}"
                        >
                            8.5
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="report-footer">
            CineLog — Relatório gerado automaticamente |
            <span th:text="${appName}">CineLog</span>
        </div>
    </body>
</html>
