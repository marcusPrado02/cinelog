# ═══════════════════════════════════════════════════════════════════
# Perfil PRODUÇÃO — superfície de ataque minimizada.
# A05 (OWASP): Security Misconfiguration
# ═══════════════════════════════════════════════════════════════════

server:
    # Não expor versão do servidor em headers HTTP
    server-header: ""
    error:
        include-message: never
        include-binding-errors: never
        include-stacktrace: never
        include-exception: false

# Swagger DESABILITADO em produção (A05)
# Expõe mapa completo da API — equivale a entregar planta da casa ao atacante.
springdoc:
    swagger-ui:
        enabled: false
    api-docs:
        enabled: false

# Actuator: superfície mínima em produção
management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
        enabled-by-default: false
    endpoint:
        health:
            enabled: true
            show-details: never # Não expõe detalhes (DB, disco, Redis)
        info:
            enabled: true
        prometheus:
            enabled: true # Métricas para Prometheus/Grafana
        # Endpoints sensíveis explicitamente DESABILITADOS
        env:
            enabled: false
        beans:
            enabled: false
        mappings:
            enabled: false
        heapdump:
            enabled: false
        threaddump:
            enabled: false
        configprops:
            enabled: false

# CORS restritivo — apenas origens explícitas via variável de ambiente
cinelog:
    security:
        cors:
            allowed-origins: ${CORS_ALLOWED_ORIGINS}
            max-age-seconds: 7200

# Logging: sem dados sensíveis, nível mínimo
logging:
    level:
        root: WARN
        com.cine.cinelog: INFO
        org.springframework.security: WARN
        org.hibernate.SQL: WARN
        org.hibernate.type.descriptor.sql: WARN
